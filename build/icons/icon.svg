<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#14532d"/>
      <stop offset="0.55" stop-color="#15803d"/>
      <stop offset="1" stop-color="#65a30d"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.32" cy="0.28" r="0.75">
      <stop offset="0" stop-color="#bbf7d0" stop-opacity="0.38"/>
      <stop offset="1" stop-color="#bbf7d0" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="ink" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#dcfce7"/>
    </linearGradient>
    <radialGradient id="spark" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fefce8"/>
      <stop offset="0.55" stop-color="#d9f99d"/>
      <stop offset="1" stop-color="#a3e635" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <g id="background">
    <rect width="1024" height="1024" fill="url(#bg)"/>
    <rect width="1024" height="1024" fill="url(#glow)"/>
    <path d="M0 760 C 240 690, 420 860, 1024 700 L1024 1024 L0 1024 Z" fill="#052e16" opacity="0.28"/>
  </g>
  <g id="foreground">
    <!-- Prompt chevron -->
    <path d="M262 352 L470 512 L262 672" fill="none" stroke="url(#ink)" stroke-width="84" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- Cursor bar -->
    <rect x="528" y="628" width="250" height="84" rx="42" fill="url(#ink)"/>
    <!-- Forge spark -->
    <circle cx="742" cy="300" r="130" fill="url(#spark)" opacity="0.55"/>
    <path d="M742 196 L768 274 L846 300 L768 326 L742 404 L716 326 L638 300 L716 274 Z" fill="#fefce8"/>
    <path d="M846 410 L856 440 L886 450 L856 460 L846 490 L836 460 L806 450 L836 440 Z" fill="#ecfccb" opacity="0.9"/>
  </g>
</svg>
