<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#07110c" />
    <meta name="description" content="Learn Python from beginner to advanced, then AI, machine learning and game AI, with deep interactive lessons and a built-in Python runtime." />
    <link rel="icon" type="image/png" href="./icon.png" />
    <title>Python Forge</title>
    <style>
      /* Boot splash shown while the app bundle loads (matches the dark theme). */
      html, body { margin: 0; background: #07110c; }
      @media (prefers-color-scheme: light) { html, body { background: #f2f7f3; } #splash { background: #f2f7f3; color: #0e1a13; } }
      #splash { position: fixed; inset: 0; display: grid; place-items: center; background: #07110c; color: #e7f3ec;
        font-family: system-ui, sans-serif; z-index: 9999; transition: opacity .35s ease; }
      #splash.hide { opacity: 0; pointer-events: none; }
      #splash .mark { width: 72px; height: 72px; animation: pulse 1.4s ease-in-out infinite; }
      #splash p { margin: 16px 0 0; font-weight: 700; letter-spacing: -0.01em; text-align: center; }
      @keyframes pulse { 50% { transform: scale(1.06); opacity: .85; } }
    </style>
  </head>
  <body>
    <div id="splash">
      <div>
        <svg class="mark" viewBox="0 0 64 64" aria-hidden="true">
          <defs><linearGradient id="sg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#4ade80"/><stop offset="1" stop-color="#15803d"/></linearGradient></defs>
          <rect x="4" y="4" width="56" height="56" rx="16" fill="url(#sg)"/>
          <path d="M16 22l12 10-12 10" fill="none" stroke="#fff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
          <path d="M32 44h16" stroke="#fff" stroke-width="5" stroke-linecap="round"/>
          <path d="M47 11l1.8 4.6 4.6 1.8-4.6 1.8L47 23.8l-1.8-4.6-4.6-1.8 4.6-1.8z" fill="#ecfccb"/>
        </svg>
        <p>Python Forge</p>
      </div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
